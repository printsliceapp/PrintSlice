<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — PrintSlice</title>
<link rel="icon" href="/logo-icon.png" type="image/png">

<style>
  :root{
    --accent:#124559; --accent-hover:#0d3546; --accent-soft:rgba(18,69,89,.14);
    --ink:#01161e; --ink-soft:#3d5560; --ink-faint:#6b8791;
    --bg:#e3ecda; --paper:#f8fbf0; --paper-soft:#dbe6d1;
    --line:rgba(1,22,30,.13); --line-strong:rgba(1,22,30,.24);
    --ok:#1f8a5f; --bad:#c1372a;
    --radius:5px; --radius-lg:9px;
    --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
  }
  a{ color:var(--accent-hover); }
  a:hover{ color:var(--accent); }
  .wrap{ max-width:560px; margin:0 auto; padding:32px 20px 80px; }
  .nav{ display:flex; align-items:center; flex-wrap:wrap; row-gap:10px; margin-bottom:40px; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); }
  .brand-icon{
    width:32px; height:32px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .brand-name{ font-weight:800; font-size:14px; letter-spacing:.06em; text-transform:uppercase; }
  .nav-links{ display:flex; flex-wrap:wrap; flex-basis:100%; justify-content:flex-end; gap:8px 16px; font-size:12px; }
  .nav-links a{ color:var(--ink-soft); text-decoration:none; font-weight:700; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }
  .nav-links a:hover{ color:var(--ink); }
  h1{ font-size:30px; margin:0 0 10px; letter-spacing:-.01em; }
  .lede{ color:var(--ink-soft); font-size:15px; margin:0 0 28px; line-height:1.6; }
  .card{
    border:1px solid var(--line-strong); border-radius:var(--radius-lg); background:var(--paper);
    padding:28px 26px; box-shadow:0 26px 54px -30px rgba(1,22,30,.3);
  }
  label{ display:block; font-size:11.5px; color:var(--ink-faint); margin-bottom:6px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  input, textarea{
    width:100%; padding:11px 13px; border:1px solid var(--line-strong); border-radius:3px;
    font-size:14px; color:var(--ink); background:var(--paper); margin-bottom:16px;
    font-family:inherit;
  }
  textarea{ resize:vertical; min-height:110px; }
  input:focus, textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  button{
    cursor:pointer; border:none; border-radius:3px; padding:13px 16px;
    font-size:13.5px; font-weight:800; width:100%; text-transform:uppercase; letter-spacing:.03em;
    background:var(--ink); color:var(--paper);
  }
  button:hover{ background:var(--accent); color:#eff6e0; }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  button:disabled{ opacity:.6; cursor:not-allowed; }
  .status-msg{ font-size:13.5px; margin-top:14px; text-align:center; }
  .status-msg.ok{ color:var(--ok); }
  .status-msg.err{ color:var(--bad); }
  .alt-contact{ margin-top:22px; font-size:13px; color:var(--ink-faint); text-align:center; line-height:1.6; }
  footer{ margin-top:48px; text-align:center; font-size:13px; color:var(--ink-faint); }
  footer a{ color:var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a class="brand" href="/">
      <div class="brand-icon">
        <img src="/logo-icon.png" alt="PrintSlice logo" width="24" height="24">
      </div>
      <span class="brand-name">PrintSlice</span>
    </a>
    <div class="nav-links">
      <a href="/app.html">Log In</a>
      <a href="/help.html">Help</a>
      <a href="/contact.html">Contact</a>
      <a href="https://discord.gg/sn6zAUXvx2" target="_blank" rel="noopener">Community</a>
      <a href="/terms.html">Terms</a>
      <a href="/privacy.html">Privacy</a>
    </div>
  </div>

  <h1>Contact us</h1>
  <p class="lede">Question, bug report, or billing issue — send it here and we'll get back to you. Worth checking the <a href="/help.html">Help page</a> first in case it's already answered.</p>

  <div class="card">
    <form id="contactForm" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <p style="display:none;"><label>Don't fill this out if you're human: <input name="bot-field"></label></p>

      <label for="cName">Name</label>
      <input type="text" id="cName" name="name" required="">

      <label for="cEmail">Email</label>
      <input type="email" id="cEmail" name="email" required="">

      <label for="cMessage">Message</label>
      <textarea id="cMessage" name="message" required="" placeholder="What's going on?"></textarea>

      <button type="submit" id="contactSubmit">Send message</button>
      <div class="status-msg" id="contactStatus"></div>
    </form>
  </div>

  <div class="alt-contact">
    Prefer email? Reach us directly at <a href="mailto:printsliceapp@gmail.com">printsliceapp@gmail.com</a>
  </div>

  <footer>
    <a href="/">← Back to PrintSlice</a>
  </footer>
</div>

<script>
// Netlify Forms handles the actual submission/storage server-side (no
// backend code needed for this) — this script just submits it via fetch
// instead of a full page reload, so we can show an inline success message.
// (Forced redeploy to re-trigger Netlify's form-detection scan.)
const form = document.getElementById('contactForm');
const statusEl = document.getElementById('contactStatus');
const submitBtn = document.getElementById('contactSubmit');

function encode(data){
  return Object.keys(data).map(k => encodeURIComponent(k) + "=" + encodeURIComponent(data[k])).join("&");
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  statusEl.textContent = '';
  statusEl.className = 'status-msg';
  const formData = Object.fromEntries(new FormData(form).entries());
  try {
    const res = await fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: encode(formData),
    });
    if (!res.ok) throw new Error('Submission failed');
    statusEl.textContent = "Thanks — we'll get back to you soon.";
    statusEl.className = 'status-msg ok';
    form.reset();
  } catch (err) {
    statusEl.textContent = "Something went wrong sending that — try emailing printsliceapp@gmail.com instead.";
    statusEl.className = 'status-msg err';
  } finally {
    submitBtn.disabled = false;
  }
});
</script>


</body></html>
