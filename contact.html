<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — PrintSlice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%B2%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --accent:#e35d45; --accent2:#ef7a63; --accent-deep:#c8432e;
    --ink:#f2f0ec; --ink-soft:#b3b0aa; --ink-faint:#84817b;
    --paper:#1c1b1a; --paper-soft:#262524;
    --line:rgba(255,255,255,.14);
    --ok:#3ecf8e; --bad:#ef4a63;
    --radius:14px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 700px at 100% 0%, rgba(227,93,69,.10) 0%, transparent 55%),
      radial-gradient(900px 600px at 0% 100%, rgba(227,93,69,.06) 0%, transparent 55%),
      #121110;
    min-height:100vh;
  }
  a{ color:var(--accent2); }
  .wrap{ max-width:560px; margin:0 auto; padding:32px 20px 80px; }
  .nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:36px; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); }
  .brand-icon{
    width:32px; height:32px; border-radius:9px; flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 14px rgba(227,93,69,.35);
  }
  .brand-name{ font-weight:800; font-size:16px; }
  .nav-links{ display:flex; gap:18px; font-size:13.5px; }
  .nav-links a{ color:var(--ink-soft); text-decoration:none; }
  .nav-links a:hover{ color:var(--ink); }
  h1{ font-size:30px; margin:0 0 8px; }
  .lede{ color:var(--ink-soft); font-size:14.5px; margin:0 0 28px; line-height:1.6; }
  .card{
    border:1px solid var(--line); border-radius:var(--radius); background:var(--paper);
    padding:26px 24px;
  }
  label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:600; }
  input, textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
    font-size:13.5px; color:var(--ink); background:var(--paper-soft); margin-bottom:16px;
    font-family:inherit;
  }
  textarea{ resize:vertical; min-height:110px; }
  input:focus, textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(227,93,69,.2); }
  button{
    cursor:pointer; border:none; border-radius:10px; padding:12px 16px;
    font-size:13.5px; font-weight:700; width:100%;
    background:linear-gradient(135deg,var(--accent),var(--accent-deep)); color:#fff;
    box-shadow:0 8px 18px rgba(227,93,69,.35);
  }
  button:hover{ filter:brightness(1.08); }
  button:disabled{ opacity:.6; cursor:not-allowed; }
  .status-msg{ font-size:13px; margin-top:14px; text-align:center; }
  .status-msg.ok{ color:var(--ok); }
  .status-msg.err{ color:var(--bad); }
  .alt-contact{ margin-top:22px; font-size:12.5px; color:var(--ink-faint); text-align:center; line-height:1.6; }
  footer{ margin-top:48px; text-align:center; font-size:12.5px; color:var(--ink-faint); }
  footer a{ color:var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a class="brand" href="/">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
          <path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M3 7l9 5 9-5M12 12v10" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-name">PrintSlice</span>
    </a>
    <div class="nav-links">
      <a href="/">App</a>
      <a href="/help.html">Help</a>
      <a href="/contact.html">Contact</a>
    </div>
  </div>

  <h1>Contact us</h1>
  <p class="lede">Question, bug report, or billing issue — send it here and we'll get back to you. Worth checking the <a href="/help.html">Help page</a> first in case it's already answered.</p>

  <div class="card">
    <form id="contactForm" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <p style="display:none;"><label>Don't fill this out if you're human: <input name="bot-field"></label></p>

      <label for="cName">Name</label>
      <input type="text" id="cName" name="name" required>

      <label for="cEmail">Email</label>
      <input type="email" id="cEmail" name="email" required>

      <label for="cMessage">Message</label>
      <textarea id="cMessage" name="message" required placeholder="What's going on?"></textarea>

      <button type="submit" id="contactSubmit">Send message</button>
      <div class="status-msg" id="contactStatus"></div>
    </form>
  </div>

  <div class="alt-contact">
    Prefer email? Reach us directly at <a href="mailto:printsliceapp@gmail.com">printsliceapp@gmail.com</a>
  </div>

  <footer>
    <a href="/">← Back to PrintSlice</a>
  </footer>
</div>

<script>
// Netlify Forms handles the actual submission/storage server-side (no
// backend code needed for this) — this script just submits it via fetch
// instead of a full page reload, so we can show an inline success message.
const form = document.getElementById('contactForm');
const statusEl = document.getElementById('contactStatus');
const submitBtn = document.getElementById('contactSubmit');

function encode(data){
  return Object.keys(data).map(k => encodeURIComponent(k) + "=" + encodeURIComponent(data[k])).join("&");
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  statusEl.textContent = '';
  statusEl.className = 'status-msg';
  const formData = Object.fromEntries(new FormData(form).entries());
  try {
    const res = await fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: encode(formData),
    });
    if (!res.ok) throw new Error('Submission failed');
    statusEl.textContent = "Thanks — we'll get back to you soon.";
    statusEl.className = 'status-msg ok';
    form.reset();
  } catch (err) {
    statusEl.textContent = "Something went wrong sending that — try emailing printsliceapp@gmail.com instead.";
    statusEl.className = 'status-msg err';
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
