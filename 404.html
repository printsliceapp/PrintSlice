<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<script src="/i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found - PrintSlice</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
<link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --accent:#124559; --accent-hover:#0d3546;
    --ink:#01161e; --ink-soft:#3d5560; --ink-faint:#6b8791;
    --bg:#e3ecda; --paper:#f8fbf0;
    --line:rgba(1,22,30,.13); --line-strong:rgba(1,22,30,.24);
    --radius-lg:9px;
    --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    color:var(--ink);
    background:var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    min-height:100vh;
  }
  a{ color:var(--accent-hover); }
  a:hover{ color:var(--accent); }
  .wrap{ max-width:560px; margin:0 auto; padding:32px 20px 80px; }
  .nav{ display:flex; align-items:center; margin-bottom:64px; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); }
  .brand-icon{ width:32px; height:32px; flex:none; display:flex; align-items:center; justify-content:center; }
  .brand-name{ font-weight:800; font-size:14px; letter-spacing:.06em; text-transform:uppercase; }
  .card{
    border:1px solid var(--line-strong); border-radius:var(--radius-lg); background:var(--paper);
    padding:34px 28px; box-shadow:0 26px 54px -30px rgba(1,22,30,.3);
  }
  .code{ font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--accent); margin:0 0 10px; }
  h1{ font-size:30px; margin:0 0 10px; letter-spacing:-.01em; }
  p{ color:var(--ink-soft); font-size:15px; line-height:1.6; margin:0 0 26px; }
  .actions{ display:flex; gap:12px; flex-wrap:wrap; }
  .btn{
    display:inline-block; padding:13px 22px; font-family:var(--mono); font-size:12px; font-weight:700;
    text-transform:uppercase; letter-spacing:.05em; text-decoration:none; border:1.5px solid var(--ink);
  }
  .btn-primary{ background:var(--ink); color:var(--paper); }
  .btn-primary:hover{ background:var(--accent); border-color:var(--accent); color:var(--paper); }
  .btn-outline{ color:var(--ink); }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a class="brand" href="/">
      <div class="brand-icon">
        <img src="/logo-icon.png" alt="PrintSlice logo" width="24" height="24">
      </div>
      <span class="brand-name">PrintSlice</span>
    </a>
  </div>

  <div class="card">
    <div class="code">ERROR 404</div>
    <h1>This piece didn't fit.</h1>
    <p>The page you're looking for doesn't exist or has moved. Head back to the homepage, or go straight to splitting your model.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/app.html">Start Slicing</a>
      <a class="btn btn-outline" href="/">Homepage</a>
      <a class="btn btn-outline" href="/help.html">Help</a>
    </div>
  </div>
</div>
</body>
</html>
