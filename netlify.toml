[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Netlify's build step just needs `npm install` to fetch stripe + supabase-js
# for the functions — there's no bundler/compile step for the static site itself.
[build.environment]
  NODE_VERSION = "20"

# Root URL now shows the marketing/welcome page instead of the app's own
# login/paywall gate — a 200 rewrite (not a redirect) so the address bar
# stays on "/" rather than jumping to "/welcome.html". The app itself is
# unaffected and stays reachable at "/index.html", which is what every
# "Open the app" / "Open App" link across the site already points to.
# `force = true` is required here — Netlify's default "shadowing" behavior
# serves a static file that exists at the "from" path (index.html does,
# since it's served at "/") instead of applying the rule at all; without
# this the redirect is silently ignored (confirmed by direct testing on
# the live site).
[[redirects]]
  from = "/"
  to = "/welcome.html"
  status = 200
  force = true
