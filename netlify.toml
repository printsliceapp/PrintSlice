[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Netlify's build step just needs `npm install` to fetch stripe + supabase-js
# for the functions — there's no bundler/compile step for the static site itself.
[build.environment]
  NODE_VERSION = "20"

# No redirect rule needed for the root URL: the marketing page IS index.html
# (renamed from welcome.html) so it's served at "/" natively, and the app
# itself was renamed to app.html to avoid colliding with Netlify's "Pretty
# URLs" setting, which silently canonicalizes any request for "/index.html"
# down to "/" — that collision was what broke a previous redirect-based
# version of this (confirmed by direct testing: "Open the app" bounced back
# to the marketing page instead of reaching the tool, since both it and
# Pretty URLs' own canonicalization were racing for the same "/" path).
